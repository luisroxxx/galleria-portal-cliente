<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Galleria | Assinatura do contrato</title>
<style>
:root{--green:#49b50a;--dark:#288500;--ink:#202320;--gray:#6c726a;--line:#e7ebe4;--pale:#f3faee}*{box-sizing:border-box}body{margin:0;background:#edf0eb;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,summary:focus-visible{outline:3px solid #216a00;outline-offset:4px}button:disabled{cursor:default}.app{max-width:440px;margin:auto;background:#fff;min-height:100dvh;display:flex;flex-direction:column;box-shadow:0 0 55px #24351809}header{height:76px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:7px;font-size:21px;letter-spacing:-1px;font-weight:650}.brand img{display:block;width:176px;max-width:100%;height:auto;mix-blend-mode:multiply}.contract{font-size:10px;line-height:1.5;text-align:right;color:var(--gray)}.contract strong{display:block;font-size:11px;color:#454b42;font-weight:500}.top{padding:21px 24px 0}.topline{display:flex;justify-content:space-between;align-items:center}.title{font-size:14px;font-weight:650}.badge{font-size:10px;font-weight:650;color:var(--dark);background:#eef8e8;padding:5px 9px;border-radius:20px}.steps{padding:20px 0 23px;display:grid;grid-template-columns:repeat(3,1fr);margin:0;list-style:none;border-bottom:1px solid var(--line)}.steps li{text-align:center;position:relative;font-size:11px;color:#8b9087}.steps li:not(:last-child):after{content:"";height:2px;width:calc(100% - 42px);position:absolute;left:calc(50% + 21px);top:16px;background:#e4e9de}.steps li.done:after{background:var(--green)}.circle{height:34px;width:34px;display:flex;justify-content:center;align-items:center;border:1.5px solid #d6dccf;color:#8d9487;background:white;border-radius:50%;margin:0 auto 7px;font-size:13px;font-weight:700}.steps li.done .circle{background:var(--green);border-color:var(--green);color:white}.steps li.current .circle{border:2px solid var(--green);color:var(--dark);box-shadow:0 0 0 4px #f0f8ea}.steps li.done,.steps li.current{color:#365428}.steps li.current{font-weight:650}.steps small{display:block;font-size:9px;line-height:1.4;margin-top:2px;font-weight:400}.content{padding:25px 24px 20px;flex:1}h1{font-size:25px;line-height:1.25;letter-spacing:-.7px;margin:15px 0 10px;font-weight:700}p{font-size:14px;color:var(--gray);margin:0 0 18px;line-height:1.65}.check{width:47px;height:47px;border-radius:50%;background:#edf8e6;color:var(--green);display:grid;place-items:center}.check svg{width:25px;height:25px}.eyebrow{font-size:11px;color:var(--dark);font-weight:600;margin-top:14px}.next{padding:19px 17px;border:1px solid #cce6bb;border-radius:12px;background:linear-gradient(115deg,#f5fbed,#fbfdf9);margin-top:24px}.next .kicker{font-size:11px;font-weight:700;color:#3c8c17;margin-bottom:11px}.next-row{display:flex;align-items:center;gap:12px}.doc-icon{height:40px;width:35px;color:var(--green);flex-shrink:0}.next h2{font-size:16px;line-height:1.4;margin:0 0 3px;font-weight:650}.next .sub{font-size:11px;color:#7c8375}.next p{font-size:12px;margin:12px 0 0}.quiet{font-size:11px;display:flex;align-items:center;gap:6px;color:#7a8274;margin-top:18px}.bottom{position:sticky;bottom:0;background:#fff;padding:15px 24px max(15px,env(safe-area-inset-bottom));border-top:1px solid #edf0e8}.primary{width:100%;border:0;border-radius:8px;background:linear-gradient(100deg,#55c313,#32a600);color:#fff;min-height:51px;padding:12px 17px;display:flex;justify-content:center;align-items:center;gap:16px;font-size:14px;font-weight:650}.primary:active{transform:translateY(1px)}.help{display:block;background:none;border:0;padding:12px 12px 0;margin:auto;font-size:11px;color:#70786a}.demo{padding:13px 20px;text-align:center;background:#f5f6f2;color:#8a9182;font-size:9px;line-height:1.6}.demo button{font-size:10px;padding:3px 8px;border:0;background:none;color:#5a7547;text-decoration:underline}.demo-controls{margin-top:5px}.document{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0;background:white;width:100%;text-align:left;color:var(--ink)}.document strong{display:block;font-size:13px}.document small{font-size:11px;color:var(--gray)}.document span:last-child{margin-left:auto;color:#639344}.tip{font-size:12px;background:var(--pale);padding:15px;border-radius:9px;color:#50713e;line-height:1.6}.provider{border:1px solid var(--line);border-radius:10px;padding:17px;margin:20px 0;display:flex;align-items:center;gap:12px}.provider strong{font-size:14px}.provider small{display:block;font-size:11px;color:var(--gray)}.provider-icon{background:#eef6e7;border-radius:8px;padding:9px;color:var(--dark)}dialog{border:0;border-radius:16px;padding:25px;width:calc(100% - 36px);max-width:390px;color:var(--ink);box-shadow:0 20px 80px #0003}dialog::backdrop{background:#17200e80}dialog h2{font-size:20px;line-height:1.3;margin:0 0 12px}dialog p{font-size:13px}dialog .close{display:block;margin:15px auto 0;border:0;background:none;color:var(--gray);font-size:12px}.pending{height:46px;width:46px;border-radius:50%;background:#f3f6ee;display:grid;place-items:center;color:#6c8c50;font-size:25px}.receipt{border:1px solid var(--line);border-radius:10px;margin-top:22px;padding:5px 17px}.receipt div{display:flex;justify-content:space-between;font-size:12px;padding:12px 0;border-bottom:1px solid var(--line)}.receipt div:last-child{border:0}.receipt span{color:var(--dark)}@media(min-width:650px){body{padding:28px 0}.app{min-height:820px;border:1px solid #e0e5da;border-radius:20px;overflow:clip}.bottom{position:static}.content{min-height:355px}}@media(max-width:359px){header,.top,.content,.bottom{padding-left:19px;padding-right:19px}h1{font-size:23px}.badge{font-size:9px}}
</style></head><body><div class="app"><header><div class="brand"><img src="assets/galleria-logo.png" alt="Galleria" width="176" height="39"></div><div class="contract">Contrato<strong>DEMONSTRAÇÃO</strong></div></header><section class="top"><div class="topline"><span class="title">Assinatura do contrato</span><span class="badge" id="badge"></span></div><ol class="steps" id="steps" aria-label="Etapas da assinatura"></ol></section><main class="content" id="content" aria-live="polite"></main><div class="bottom"><button class="primary" id="action"></button><button class="help" id="help">Preciso de ajuda</button></div><footer class="demo">Protótipo · nenhuma assinatura real<div class="demo-controls"><button data-screen="identity">Etapa 1</button><button data-screen="forms">Etapa 2</button><button data-screen="bridge">Após as fichas</button><button data-screen="cci">Etapa 3</button></div></footer></div><dialog id="dialog"><div id="dialog-content"></div><button class="close" id="close">Fechar</button></dialog>
<script>
const $=id=>document.getElementById(id);let screen='bridge';const tick='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg>';const doc='<svg class="doc-icon" viewBox="0 0 36 42" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7 2h15l8 8v29H7z"/><path d="M22 2v9h8M12 19h13M12 25h13M12 31h8"/></svg>';const arrow='<span aria-hidden="true">→</span>';
function go(s){screen=s;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){const count={identity:0,forms:1,bridge:2,cci:2,waiting:2,done:3}[screen];$('badge').textContent=count===3?'3 de 3 concluídas':count+' de 3 concluídas';$('steps').innerHTML=['Biometria','Fichas cadastrais','Contrato / CCI'].map((n,i)=>`<li class="${i<count?'done':i===count?'current':''}" ${i===count?'aria-current="step"':''}><span class="circle">${i+1}</span>${n}<small>${i<count?'Concluída':i===count?'Pendente':'A seguir'}</small></li>`).join('');let html='',label='',action;
if(screen==='bridge'){html=`<div class="check">${tick}</div><div class="eyebrow">Etapa 2 concluída</div><h1>Fichas cadastrais<br>assinadas!</h1><p>Agora falta assinar seu contrato com o certificado digital.</p><section class="next"><div class="kicker">FALTA SÓ 1 ETAPA</div><div class="next-row">${doc}<div><h2>3. Assinar contrato / CCI</h2><div class="sub">Cédula de Crédito Imobiliário</div></div></div><p>Tenha seu certificado digital em mãos para continuar.</p></section>`;label='Continuar para a última etapa '+arrow;action=()=>go('cci')}
if(screen==='identity'){html=`<div class="eyebrow">Etapa 1 de 3</div><h1>Vamos confirmar<br>sua identidade.</h1><p>A verificação facial é o primeiro passo para assinar seus documentos.</p><div class="next"><h2>É rápido e simples</h2><p>Fique em um local iluminado e tenha o rosto livre de acessórios.</p></div>`;label='Iniciar biometria '+arrow;action=()=>show('<h2>Verificação facial</h2><p>Nesta demonstração, a câmera não será aberta.</p><button class="primary" id="simulate">Simular biometria aprovada</button>',()=>go('forms'))}
if(screen==='forms'){html=`<div class="eyebrow">Etapa 2 de 3</div><h1>Confira suas<br>fichas cadastrais.</h1><p>Leia os documentos antes de assinar.</p><button class="document" id="read">${doc}<span><strong>Fichas cadastrais</strong><small>Visualizar documentos</small></span><span>↗</span></button><div class="tip">Depois das fichas, falta a última etapa: assinar seu contrato / CCI.</div>`;label='Assinar fichas cadastrais '+arrow;action=()=>show('<h2>Assinatura das fichas</h2><p>Esta ação simula a confirmação das fichas cadastrais.</p><button class="primary" id="simulate">Simular fichas assinadas</button>',()=>go('bridge'))}
if(screen==='cci'){html=`<div class="eyebrow">Etapa 3 de 3 · Última etapa</div><h1>Assine seu contrato<br>com o certificado.</h1><p>Confira a CCI e continue para a assinatura digital.</p><button class="document" id="read">${doc}<span><strong>Contrato / CCI</strong><small>Visualizar documento</small></span><span>↗</span></button><div class="provider"><div class="provider-icon">▣</div><div><strong>Certificado digital</strong><small>Você será direcionado ao assinador.</small></div></div><div class="tip">Após autorizar no aplicativo do certificado, volte aqui para confirmar se a assinatura foi concluída.</div>`;label='Ir para assinatura digital '+arrow;action=()=>show('<h2>Continuar no assinador</h2><p>No fluxo real, você usará seu certificado digital para assinar a CCI.</p><p>Esta demonstração não abre o aplicativo do certificado.</p><button class="primary" id="simulate">Simular retorno ao portal</button>',()=>go('waiting'))}
if(screen==='waiting'){html=`<div class="pending">◷</div><div class="eyebrow">Etapa 3 de 3</div><h1>Confirmando sua<br>assinatura.</h1><p>Você voltou do certificado. Ainda estamos aguardando a confirmação da assinatura do contrato.</p><div class="tip">A etapa 3 permanece pendente até a confirmação. Você pode consultar novamente.</div>`;label='Consultar assinatura '+arrow;action=()=>show('<h2>Consultar assinatura</h2><p>Na versão real, consultaremos o status no provedor de assinatura.</p><button class="primary" id="simulate">Simular assinatura confirmada</button>',()=>go('done'))}
if(screen==='done'){html=`<div class="check">${tick}</div><div class="eyebrow">3 de 3 etapas concluídas</div><h1>Suas assinaturas<br>estão concluídas!</h1><p>Pronto! Você concluiu todas as suas etapas de assinatura.</p><div class="receipt"><div>Biometria<span>Concluída ✓</span></div><div>Fichas cadastrais<span>Assinadas ✓</span></div><div>Contrato / CCI<span>Assinado ✓</span></div></div><div class="quiet">A operação seguirá para as próximas validações.</div>`;label='Ver meus documentos '+arrow;action=()=>show('<h2>Seus documentos</h2><p>Fichas cadastrais · assinadas<br>Contrato / CCI · assinado</p><p>Os documentos deste protótipo são demonstrativos.</p>')}
$('content').innerHTML=html;$('action').innerHTML=label;$('action').onclick=action;const read=$('read');if(read)read.onclick=()=>show('<h2>'+ (screen==='forms'?'Fichas cadastrais':'Contrato / CCI')+'</h2><p>Documento de exemplo, sem validade. No portal real, o cliente poderá ler o PDF completo antes de assinar.</p>')}
function show(html,cb){$('dialog-content').innerHTML=html;$('dialog').showModal();const b=$('simulate');if(b)b.onclick=()=>{$('dialog').close();cb()}}$('close').onclick=()=>$('dialog').close();$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))$('dialog').close()});$('help').onclick=()=>show('<h2>Falta qual etapa?</h2><p><strong>1. Biometria:</strong> confirma sua identidade.<br><strong>2. Fichas cadastrais:</strong> assinatura dos documentos cadastrais.<br><strong>3. Contrato / CCI:</strong> assinatura com certificado digital.</p><p>As fichas assinadas concluem a etapa 2. Para terminar, avance para a etapa 3.</p>');document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>go(b.dataset.screen));render();
</script></body></html>
