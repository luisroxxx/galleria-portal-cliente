function steps(){const count=data.stage;$('top').innerHTML=`<div class="topbar"><button class="back" id="back">← Meu contrato</button><span class="tag">DEMO-001</span></div><section class="stepbox"><div class="stephead"><span>Sua assinatura</span><span class="tag">${count} de 3 concluídas</span></div><ol class="stepper" aria-label="Etapas da assinatura">${['Biometria','Fichas cadastrais','Contrato / CCI'].map((n,i)=>`<li class="${i<count?'done':i===count?'current':''}" ${i===count?'aria-current="step"':''}><span class="circle">${i+1}</span>${n}<small>${i<count?'Concluída':i===count?'Pendente':'A seguir'}</small></li>`).join('')}</ol></section>`;$('back').onclick=()=>go('contract')}
